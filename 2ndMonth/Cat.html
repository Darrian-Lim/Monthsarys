<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>I Love You – Cat Animation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #c8c8c8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #stage {
      width: 500px;
      height: 300px;
      background: #ebebeb;
      border-radius: 14px;
      position: relative;
      overflow: hidden;
    }

    #scene1, #scene2 {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.9s ease;
    }
    #scene2 { opacity: 0; pointer-events: none; }
    #scene2.visible { opacity: 1; pointer-events: all; }
    #scene1.hidden  { opacity: 0; pointer-events: none; }

    /* ── SCENE 1 ── */
    #cat-wrap {
      position: relative;
      width: 460px;
      height: 240px;
    }

    /* The SVG cat sits left-centre */
    #cat-svg {
      position: absolute;
      left: 10px;
      bottom: 0;
    }

    /* "I Love You" floats right at the paw tip.
       Paw tip in SVG coords ≈ (218, 118).
       SVG is 260px wide, 180px tall, positioned left:10 bottom:0
       stage height 240 → top of SVG = 240-180 = 60px
       text top = 60 + 118 - 10 = 168 → tweak to 148 for centre of text */
    #love-text {
      position: absolute;
      left: 232px;
      top: 180px;
      font-size: 28px;
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
      color: #2a2a2a;
      transform-origin: 0% 60%;
      animation: swingText 1.4s ease-in-out infinite;
      user-select: none;
      white-space: nowrap;
    }

    @keyframes swingText {
      0%   { transform: rotate(0deg)   translateX(0px); }
      20%  { transform: rotate(-22deg) translateX(-10px); }
      42%  { transform: rotate(16deg)  translateX(8px); }
      64%  { transform: rotate(-8deg)  translateX(-4px); }
      82%  { transform: rotate(4deg)   translateX(2px); }
      100% { transform: rotate(0deg)   translateX(0px); }
    }

    /* cat part animations */
    @keyframes tailWag {
      0%, 100% { transform: rotate(0deg); }
      50%       { transform: rotate(16deg); }
    }
    @keyframes earTwitchR {
      0%, 72%, 100% { transform: rotate(0deg); }
      80%            { transform: rotate(-7deg); }
      90%            { transform: rotate(5deg); }
    }
    @keyframes pawBat {
      0%        { transform: rotate(0deg)   translate(0px, 0px); }
      18%       { transform: rotate(-28deg) translate(-10px, -4px); }
      36%       { transform: rotate(6deg)   translate(2px, 2px); }
      100%      { transform: rotate(0deg)   translate(0px, 0px); }
    }
    @keyframes bodyBounce {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-2px); }
    }

    .anim-tail      { transform-origin: 68px 105px;  animation: tailWag     0.72s ease-in-out infinite; }
    .anim-ear-r     { transform-origin: 165px 42px;  animation: earTwitchR  1.4s  ease-in-out infinite; }
    .anim-paw       { transform-origin: 180px 112px; animation: pawBat      1.4s  ease-in-out infinite; }
    .anim-body      { animation: bodyBounce 1.4s ease-in-out infinite; }

    /* ── SCENE 2 ── */
    #scene2-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    #love-title {
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
      font-size: 36px;
      color: #3a7bd5;
      font-weight: bold;
    }
    #play-again {
      margin-top: 10px;
      padding: 7px 28px;
      background: white;
      border: 1px solid #aaa;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
      color: #333;
    }
    #play-again:hover { background: #f0f0f0; }

    @keyframes floatHeart {
      0%, 100% { transform: translateY(0px)  scale(1); }
      50%       { transform: translateY(-10px) scale(1.2); }
    }
    .heart-float { animation: floatHeart 1.1s ease-in-out infinite; transform-origin: 118px 56px; }
  </style>
</head>
<body>
<div id="stage">

  <!-- ══════════ SCENE 1: black cat ══════════ -->
  <div id="scene1">
    <div id="cat-wrap">
      <div id="love-text">I Love You</div>

      <!--
        Cat viewBox 260×180
        Body loaf centre ≈ (105,120)
        Head centre ≈ (148,72)
        Batting paw tip ≈ (218,118)  ← love-text anchors here
      -->
      <svg id="cat-svg" width="260" height="180" viewBox="0 0 260 180">

        <!-- ── TAIL (single smooth curve) ── -->
        <g class="anim-tail">
          <path d="M68 105 Q14 88 10 62 Q6 42 28 36"
                stroke="#1c1c1c" stroke-width="10"
                fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- ── BODY (smooth loaf blob) ── -->
        <g class="anim-body">
          <!-- main loaf -->
          <path d="
            M 60 148
            Q 55 148 52 138
            Q 48 120 52 105
            Q 56 90  72 88
            Q 88 86  108 87
            Q 130 88 148 92
            Q 162 95 166 108
            Q 170 122 164 138
            Q 160 148 154 149
            Z"
            fill="#1c1c1c"/>

          <!-- BACK PAWS (chubby bean shapes) -->
          <!-- back left paw -->
          <ellipse cx="72"  cy="152" rx="14" ry="9" fill="#1c1c1c"/>
          <ellipse cx="64"  cy="158" rx="6"  ry="4" fill="#1c1c1c"/>
          <ellipse cx="72"  cy="160" rx="6"  ry="4" fill="#1c1c1c"/>
          <ellipse cx="80"  cy="158" rx="6"  ry="4" fill="#1c1c1c"/>

          <!-- back right paw -->
          <ellipse cx="118" cy="152" rx="14" ry="9" fill="#1c1c1c"/>
          <ellipse cx="110" cy="158" rx="6"  ry="4" fill="#1c1c1c"/>
          <ellipse cx="118" cy="160" rx="6"  ry="4" fill="#1c1c1c"/>
          <ellipse cx="126" cy="158" rx="6"  ry="4" fill="#1c1c1c"/>

          <!-- front static paw -->
          <ellipse cx="152" cy="152" rx="13" ry="8" fill="#1c1c1c"/>
          <ellipse cx="144" cy="157" rx="5"  ry="3.5" fill="#1c1c1c"/>
          <ellipse cx="152" cy="159" rx="5"  ry="3.5" fill="#1c1c1c"/>
          <ellipse cx="160" cy="157" rx="5"  ry="3.5" fill="#1c1c1c"/>
        </g>

        <!-- ── NECK ── -->
        <path d="M 132 100 Q 138 82 148 78 Q 158 82 158 98" fill="#1c1c1c"/>

        <!-- ── HEAD (round blob) ── -->
        <ellipse cx="150" cy="65" rx="34" ry="30" fill="#1c1c1c"/>

        <!-- ── EARS with pink inner ── -->
        <!-- left ear -->
        <polygon points="122,50 116,26 136,44" fill="#1c1c1c"/>
        <polygon points="124,48 121,31 133,44" fill="#c06080"/>

        <!-- right ear (twitches) -->
        <g class="anim-ear-r">
          <polygon points="158,44 165,20 178,42" fill="#1c1c1c"/>
          <polygon points="160,43 165,27 175,42" fill="#c06080"/>
        </g>

        <!-- ── EYES (large, glossy) ── -->
        <circle cx="140" cy="62" r="7.5" fill="white"/>
        <circle cx="160" cy="62" r="7.5" fill="white"/>
        <circle cx="141" cy="63" r="4"   fill="#111"/>
        <circle cx="161" cy="63" r="4"   fill="#111"/>
        <!-- glint -->
        <circle cx="143" cy="60" r="2"   fill="white"/>
        <circle cx="163" cy="60" r="2"   fill="white"/>

        <!-- ── NOSE ── -->
        <path d="M148 72 L150 70 L152 72 Q150 75 148 72Z" fill="#c06080"/>

        <!-- ── WHISKERS ── -->
        <line x1="152" y1="73" x2="178" y2="68" stroke="#555" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
        <line x1="152" y1="74" x2="178" y2="74" stroke="#555" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
        <line x1="152" y1="75" x2="178" y2="80" stroke="#555" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
        <line x1="148" y1="73" x2="124" y2="68" stroke="#555" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
        <line x1="148" y1="74" x2="122" y2="74" stroke="#555" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
        <line x1="148" y1="75" x2="124" y2="80" stroke="#555" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

        <!-- ── BATTING PAW (arm + paw beans) ── -->
        <g class="anim-paw">
          <!-- arm -->
          <path d="M 162 105 Q 178 100 196 106 Q 210 110 218 118"
                stroke="#1c1c1c" stroke-width="12"
                fill="none" stroke-linecap="round"/>
          <!-- paw pad -->
          <ellipse cx="218" cy="120" rx="13" ry="9" fill="#1c1c1c"/>
          <!-- toe beans -->
          <ellipse cx="209" cy="126" rx="5.5" ry="4" fill="#1c1c1c"/>
          <ellipse cx="218" cy="129" rx="5.5" ry="4" fill="#1c1c1c"/>
          <ellipse cx="227" cy="126" rx="5.5" ry="4" fill="#1c1c1c"/>
          <!-- centre pad hint (slightly lighter) -->
          <ellipse cx="218" cy="120" rx="7"   ry="5" fill="#2e2e2e"/>
        </g>

      </svg>
    </div>
  </div>

  <!-- ══════════ SCENE 2: cute hugging cats ══════════ -->
  <div id="scene2">
    <div id="scene2-inner">
      <div id="love-title">I Love You</div>
      <svg width="170" height="165" viewBox="0 0 160 160">
        <!-- gray cat bottom -->
        <ellipse cx="80" cy="130" rx="54" ry="28" fill="#b0b0b0"/>
        <ellipse cx="65" cy="104" rx="28" ry="26" fill="#b0b0b0"/>
        <polygon points="48,91 44,72 62,88" fill="#b0b0b0"/>
        <polygon points="80,88 87,70 94,88" fill="#b0b0b0"/>
        <polygon points="50,90 47,78 60,87" fill="#e8a0a8"/>
        <polygon points="82,87 87,76 92,87" fill="#e8a0a8"/>
        <path d="M57 103 Q61 100 65 103" stroke="#444" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M70 103 Q74 100 78 103" stroke="#444" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="54"  cy="109" rx="6" ry="3.5" fill="#f0a0c0" opacity="0.6"/>
        <ellipse cx="78"  cy="109" rx="6" ry="3.5" fill="#f0a0c0" opacity="0.6"/>
        <ellipse cx="65"  cy="108" rx="2.5" ry="2" fill="#d06080"/>
        <path d="M61 112 Q65 116 69 112" stroke="#999" stroke-width="1.3" fill="none"/>
        <path d="M130 135 Q150 124 146 108" stroke="#b0b0b0" stroke-width="8" fill="none" stroke-linecap="round"/>
        <!-- white cat top -->
        <ellipse cx="93" cy="108" rx="36" ry="30" fill="#f2f2ec"/>
        <ellipse cx="103" cy="78" rx="26" ry="24" fill="#f2f2ec"/>
        <polygon points="90,66 85,48 100,64" fill="#f2f2ec"/>
        <polygon points="114,64 120,48 126,64" fill="#f2f2ec"/>
        <polygon points="91,65 87,56 98,63" fill="#e8a0a8"/>
        <polygon points="115,63 120,55 124,63" fill="#e8a0a8"/>
        <path d="M94 77 Q99 74 104 77" stroke="#444" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M107 77 Q112 74 117 77" stroke="#444" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="93"  cy="83" rx="6" ry="3.5" fill="#f0a0c0" opacity="0.7"/>
        <ellipse cx="116" cy="83" rx="6" ry="3.5" fill="#f0a0c0" opacity="0.7"/>
        <ellipse cx="103" cy="83" rx="2.5" ry="2" fill="#d06080"/>
        <path d="M99 87 Q103 91 107 87" stroke="#bbb" stroke-width="1.3" fill="none"/>
        <path d="M72 110 Q60 120 66 132" stroke="#f2f2ec" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M116 116 Q124 126 118 134" stroke="#f2f2ec" stroke-width="9" fill="none" stroke-linecap="round"/>
        <!-- heart -->
        <g class="heart-float">
          <path d="M118 68 C118 68 108 57 108 51 C108 45 114 43 118 49 C122 43 128 45 128 51 C128 57 118 68 118 68Z" fill="#e83030"/>
        </g>
      </svg>
      <button id="play-again">Play Again</button>
    </div>
  </div>

</div>
<script>
  const scene1 = document.getElementById('scene1');
  const scene2 = document.getElementById('scene2');
  document.getElementById('play-again').addEventListener('click', play);

  function play() {
    scene1.classList.remove('hidden');
    scene2.classList.remove('visible');
    setTimeout(() => {
      scene1.classList.add('hidden');
      scene2.classList.add('visible');
    }, 4500);
  }
  play();
</script>
</body>
</html>
