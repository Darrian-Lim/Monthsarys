<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cloud Nine · Month 7</title><meta name="theme-color" content="#f3c3e6">
<meta name="description" content="A tiny floating world made to celebrate seven months together.">
<link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/animations.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<canvas id="world" aria-hidden="true"></canvas>
<div id="loader" class="loader" aria-hidden="true"><span>☁️</span><small>building your little world…</small></div>
<main class="ui">
  <header id="title" class="title-block">
    <p class="eyebrow" data-t="eyebrow"></p><h1 class="title" id="h1"></h1>
    <p class="tagline" data-t="tagline"></p><p class="sub" data-t="subline"></p>
  </header>
  <button id="go" class="btn" hidden></button>
  <p id="hint" class="hint" hidden></p>
</main>
<section id="panel" class="panel" role="dialog" aria-labelledby="panelTitle" aria-describedby="panelText" aria-live="polite" hidden>
  <button class="panel-close" id="panelClose" aria-label="Close panel">×</button>
  <p class="panel-kicker" id="panelKicker">A LITTLE SURPRISE</p><h2 id="panelTitle">Hello, cloud explorer!</h2>
  <img id="panelImg" class="panel-img" alt="" hidden><p id="panelText">There's something waiting for you.</p><div id="panelActions" class="panel-actions"></div>
</section>
<button id="menuBtn" class="btn menu-btn" hidden>✨ Menu</button>
<div id="confetti" class="confetti" aria-hidden="true"></div>
<button id="soundToggle" class="sound-toggle" aria-label="Toggle sound effects" title="Toggle sound effects">♫ <span>Sound off</span></button>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<p class="sr">Explore a cheerful 3D world of floating islands, gifts, balloons, and a little cat.</p>
<noscript><p class="sr">Cloud Nine needs JavaScript enabled.</p></noscript>
<script type="module" src="js/main.js"></script>
