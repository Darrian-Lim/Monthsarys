<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy 1st Monthsary ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffe4ec, #fff5f8);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .container {
      width: 90%;
      max-width: 800px;
      text-align: center;
      padding: 20px;
    }

    .surprise-box, .letter-box {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      transition: all 0.8s ease;
    }

    .letter-box {
      display: none;
      opacity: 0;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 3.5rem;
      color: #e75480;
      margin-bottom: 10px;
    }

    h2 {
      color: #d63384;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #444;
      text-align: left;
      margin: 8px 0;
    }

    .surprise-box p {
      text-align: center;
    }

    .btn {
      margin-top: 25px;
      padding: 15px 35px;
      font-size: 1.1rem;
      border: none;
      border-radius: 50px;
      background: linear-gradient(45deg, #ff6b9d, #ff8fab);
      color: white;
      cursor: pointer;
    }

    .heart {
      position: fixed;
      font-size: 1.5rem;
      animation: floatUp 6s linear infinite;
      opacity: 0.7;
      pointer-events: none;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      to {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="surprise-box" id="surpriseBox">
      <h1>For You ❤️</h1>
      <h2>I have something special for you...</h2>
      <p>
        Thank you for making this past month so incredibly beautiful.
        Every moment with you has been a memory worth keeping.
      </p>
      <button class="btn" onclick="revealLetter()" type="button">Click Here for a Surprise ✨</button>
    </div>

    <div class="letter-box" id="letterBox">
      <h1>Happy 1 Month Babyy! ❤️</h1>
      <p id="typeText"></p>
      <button class="btn" onclick="moreHearts()" type="button">💖</button>
    </div>

  </div>

  <script>
    let revealed = false;

    const letter = `I love you soo much and I never want you to forget that. I just hope that we can be together forever and ever. That future we have talked about, well I wanna make it happen. I want to spend the rest of my life with you. I wanna make memories together. You are just so perfect and cute. Just looking at you makes me speechless. I love staring into your eyes and listening to your voice and feeling your warmth when you hug me.

Idk if I say this enough, but I love you so much. My love for you is so deep and idk how can I ever express or even explain it to you, but i truly mean it when I tell you I love you. I feel like you are the best thing to ever happen to me, like when I am with you i feel like I never want to leave your side. You make me happier than anyone ever has and being around you is always enough to turn a bad day into a good one. I want you to know that you are an amazing person and i am so proud of you for everything you have achieved and done. I truly cherish our relationship and want it to last because you have a great personality and make me feel loved with the things you say. I love you so much and you are so gorgeous, don't ever let anyone tell you otherwise darling.

Thank you for giving me this chance with you and i will do my best so that you dont regret it. I love you so so much and i will never regret my decision to fall this deeply in love with you.`;

    function revealLetter() {
      if (revealed) return;
      revealed = true;

      const box1 = document.getElementById('surpriseBox');
      const box2 = document.getElementById('letterBox');

      box1.style.opacity = '0';

      setTimeout(() => {
        box1.style.display = 'none';
        box2.style.display = 'block';
        box2.style.opacity = '1';

        setTimeout(() => {
          typeWriter();
          createHearts();
        }, 200);

      }, 500);
    }

    function typeWriter() {
      let i = 0;
      const speed = 25;
      const textEl = document.getElementById("typeText");
      textEl.innerHTML = "";

      function typing() {
        if (i < letter.length) {
          const char = letter.charAt(i);
          textEl.innerHTML += (char === "\n") ? "<br><br>" : char;
          i++;
          setTimeout(typing, speed);
        }
      }

      typing();
    }

    function createHearts() {
      for (let i = 0; i < 25; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.className = 'heart';
          heart.innerHTML = '💖';
          heart.style.left = Math.random() * 100 + 'vw';
          heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 7000);
        }, i * 150);
      }
    }

    function moreHearts() {
      createHearts();
    }
  </script>
</body>
</html>
